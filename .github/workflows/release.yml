name: Release

# Release will only be triggered on a tag push for a commit that's already on
# `prod`.
on:
  push:
    tags:
      - "**"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit, all branches, and all tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether this tag releases a version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$GITHUB_REF_NAME"
          commit_sha="$(git rev-parse "$GITHUB_SHA^{commit}")"
          manifest_version="$(jq -r .version manifest.json)"
          echo "Tag: $release_tag"
          echo "Commit: $commit_sha"
          echo "Manifest version: $manifest_version"

          if ! git merge-base --is-ancestor "$commit_sha" origin/prod; then
            echo "The commit is not on prod, so nothing is released."
            exit 0
          fi

          # The tag must be the same as the manifest version.
          if [ "$release_tag" != "$manifest_version" ] &&
             [ "$release_tag" != "v$manifest_version" ]; then
            echo "::error::Tag $release_tag does not match manifest" \
              "version $manifest_version."
            exit 1
          fi

          if gh release view "$release_tag" > /dev/null 2>&1; then
            echo "Release $release_tag already exists, so nothing is released."
            exit 0
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.tag.outputs.tag != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the extension package
        if: steps.tag.outputs.tag != ''
        run: >-
          npx --yes web-ext@8 build
          --source-dir .
          --artifacts-dir web-ext-artifacts
          --filename "put-site-domain-in-tab-title-{version}.xpi"
          --ignore-files README.md web-ext-artifacts

      - name: Submit to addons.mozilla.org
        if: steps.tag.outputs.tag != ''
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >-
          npx --yes web-ext@8 sign
          --source-dir .
          --artifacts-dir web-ext-artifacts
          --ignore-files README.md web-ext-artifacts
          --channel listed
          --approval-timeout 0

      - name: Publish to GitHub Releases
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          package_name="put-site-domain-in-tab-title-$RELEASE_VERSION.xpi"
          gh release create "$RELEASE_TAG" "web-ext-artifacts/$package_name" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
